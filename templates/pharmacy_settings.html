<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Profile Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">
        <div style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; padding: 40px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); max-width: 550px; width: 100%; color: white;">
            
            <h2 style="margin-bottom: 10px; font-weight: bold; text-align: center;">
                <i class="fas fa-cog style-spin" style="color: #4caf50;"></i> Store Profile Settings
            </h2>
            <p style="text-align: center; opacity: 0.8; font-size: 14px; margin-bottom: 30px;">
                Update your public storefront information visible to customers.
            </p>

            <form action="/save_pharmacy_settings" method="POST">
                <div style="margin-bottom: 20px;">
    <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; opacity: 0.9;">Pharmacy Name</label>
    <input type="text" name="pharmacy_name" value="{{ profile.name }}" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-size: 15px;">
</div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; opacity: 0.9;">Store Address / Location</label>
                    <input type="text" name="location" value="{{ profile.location }}" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-size: 15px;">
                </div>

                <div style="margin-bottom: 30px;">
                    <label style="display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; opacity: 0.9;">Contact Phone Number</label>
                    <input type="text" name="phone" value="{{ profile.phone }}" required style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-size: 15px;">
                </div>

                <div style="display: flex; gap: 12px;">
                    <a href="/pharmacy_dashboard" style="text-decoration: none; text-align: center; width: 50%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; border-radius: 8px; font-weight: bold; font-size: 15px;">
                        Cancel
                    </a>
                    <button type="submit" style="width: 50%; padding: 12px; background: #4caf50; border: none; color: white; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(76,175,80,0.3);">
                        Save Changes
                    </button>
                </div>
            </form>

        </div>
    </div>
</body>
</html>
