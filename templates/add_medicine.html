<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Stock Item</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark container py-5" style="max-width: 550px;">

    <div class="card shadow-lg border-0 bg-secondary text-white p-4 rounded-3 mt-5">
        <h3 class="mb-3 text-center fw-bold"><i class="fas fa-pills text-warning"></i> Add New Stock Record</h3>
        <p class="text-center text-light mb-4 small">Log a medicine count directly into your pharmacy's live inventory system.</p>
        
        <form action="/add_medicine" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold small">Medicine Name</label>
                <input type="text" name="medicine_name" class="form-control" required placeholder="e.g., Paracetamol">
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold small">Generic Formulations Name</label>
                <input type="text" name="generic_name" class="form-control" required placeholder="e.g., Acetaminophen">
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold small">Available Quantity (Stock Units)</label>
                <input type="number" name="quantity" class="form-control" required min="1" placeholder="e.g., 50">
            </div>

            <div style="margin-bottom: 30px;">
    <label style="display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; opacity: 0.9; text-align: left;">
        <i class="fas fa-calendar-alt" style="color: #ffbc00; margin-right: 5px;"></i> Expiry Date
    </label>
    <input type="date" name="expiry_date" required style="width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; background: rgba(255,255,255,0.9); color: #333; font-size: 15px; box-sizing: border-box;">
</div>
            
            <div class="d-flex gap-2">
                <a href="/pharmacy_dashboard" class="btn btn-outline-light w-50 fw-bold">Cancel</a>
                <button type="submit" class="btn btn-warning w-50 fw-bold text-dark">Save to Inventory</button>
            </div>
        </form>
    </div>

</body>
</html>
