<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Dashboard - Pharmacy Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Header -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <i class="fas fa-pills"></i>
                <span>Pharmacy Finder</span>
            </div>
            <div class="navbar-actions">
                <a href="/" class="nav-btn login-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div style="max-width: 1200px; width: 100%; margin: 40px auto;">
            <div style="background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 20px; padding: 40px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); color: white;">
                <h1 style="margin-bottom: 30px; color: white;">
                    <i class="fas fa-store"></i> Pharmacy Dashboard
                </h1>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                    <div style="background: rgba(25, 118, 210, 0.2); padding: 20px; border-radius: 12px; text-align: center;">
                        <div style="font-size: 40px; color: #1976d2; margin-bottom: 10px;">
                            <i class="fas fa-capsules"></i>
                        </div>
                        <p style="opacity: 0.8;">Medicines in Stock</p>
                        <h3 style="margin: 10px 0; font-size: 28px;">-</h3>
                    </div>

                    <div style="background: rgba(76, 175, 80, 0.2); padding: 20px; border-radius: 12px; text-align: center;">
                        <div style="font-size: 40px; color: #43a047; margin-bottom: 10px;">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <p style="opacity: 0.8;">Total Sales</p>
                        <h3 style="margin: 10px 0; font-size: 28px;">-</h3>
                    </div>

                    <div style="background: rgba(255, 193, 7, 0.2); padding: 20px; border-radius: 12px; text-align: center;">
                        <div style="font-size: 40px; color: #ffc107; margin-bottom: 10px;">
                            <i class="fas fa-users"></i>
                        </div>
                        <p style="opacity: 0.8;">Total Customers</p>
                        <h3 style="margin: 10px 0; font-size: 28px;">-</h3>
                    </div>
                </div>

                <div style="padding: 20px; background: rgba(255, 255, 255, 0.1); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); margin-bottom: 30px;">
                    <h3 style="margin-bottom: 15px;">Quick Actions</h3>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button class="btn btn-primary" style="padding: 10px 20px;">
                            <i class="fas fa-plus"></i> Add Medicine
                        </button>
                        <button class="btn btn-secondary" style="padding: 10px 20px;">
                            <i class="fas fa-list"></i> View Inventory
                        </button>
                        <button class="btn btn-success" style="padding: 10px 20px;">
                            <i class="fas fa-cog"></i> Settings
                        </button>
                    </div>
                </div>

                <p style="text-align: center; opacity: 0.7; font-size: 14px;">
                    More features coming soon! Stay tuned for inventory management tools.
                </p>
            </div>
        </div>

        <div class="footer-section">
            <p>&copy; 2026 Pharmacy Finder. Your trusted medicine search platform.</p>
        </div>
    </div>
</body>
</html>
