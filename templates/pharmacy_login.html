<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Login - Pharmacy Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .alert-message {
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
        .alert-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #ffcdd2;
        }
        .alert-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #c8e6c9;
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <i class="fas fa-pills"></i>
                <span>Pharmacy Finder</span>
            </div>
            <div class="navbar-actions">
                <a href="/" class="nav-btn login-btn">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="form-container">
            <h1>
                <i class="fas fa-lock"></i> Pharmacy Portal Login
            </h1>

            {% if message %}
                <div style="background: {% if error %}rgba(244, 67, 54, 0.2){% else %}rgba(76, 175, 80, 0.2){% endif %}; border: 1px solid {% if error %}#f44336{% else %}#4caf50{% endif %}; border-radius: 8px; padding: 15px; margin-bottom: 20px; color: {% if error %}#ffcdd2{% else %}#c8e6c9{% endif %}; text-align: center; font-weight: 500;">
                    <i class="fas fa-{% if error %}exclamation-circle{% else %}check-circle{% endif %}"></i> {{ message }}
                </div>
            {% endif %}

            <form method="POST" action="/verify_pharmacy_login">
                <div class="form-group">
                    <label for="username">Username <span style="color: #ff6b35;">*</span></label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">Password <span style="color: #ff6b35;">*</span></label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>
                </div>

                <button type="submit" class="form-submit">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 13px; opacity: 0.8;">
                Not registered yet? <a href="/pharmacy_register" style="color: #43a047; text-decoration: none; font-weight: 600;">Register your pharmacy</a>
            </p>
        </div>

        <div class="footer-section">
            <p>&copy; 2026 Pharmacy Finder. Your trusted medicine search platform.</p>
        </div>
    </div>
</body>
</html>
